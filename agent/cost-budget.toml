schema_version = "1.0.0"

[global]
kill_switch_env = "JERYU_FINDER_BENCH_KILL"

[stop_conditions]
bench_halt_on_kill_switch = true
bench_halt_on_wall_clock_overrun = true
spend_cap_usd = 0
quota = "zero paid API calls"


[bench]
max_wall_clock_seconds = 600
max_ci_concurrent_jobs = 4

[dependencies]
denied_crates = []
license_allowlist = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
max_advisory_count = 0
